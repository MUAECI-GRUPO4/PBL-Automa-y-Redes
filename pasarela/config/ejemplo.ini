# Configuración de ejemplo. Copiar a config/pasarela.ini (ignorado por git) y adaptar.
# Los comentarios van en su propia línea: configparser no quita los comentarios al final de un valor.
# Nada de claves ni contraseñas reales aquí.

[gateway]
log_level = INFO
# O1: ninguna salida escribe en los PLC
read_only = true

[acquisition]
# A2: cambiar el simulador por los PLC reales solo toca esta sección
connectors = udp

[acquisition.udp]
bind = 0.0.0.0
port = 5000
# interfaz de la red de campo (O5)
iface = eth_ot
# plc_id:nombre. Cada PLC lleva su identificador de 1 byte en el datagrama
plcs = 1:estacion_a, 2:estacion_b, 3:estacion_c, 4:estacion_d

[outputs]
# A3 y A4: añadir o quitar salidas sin tocar el resto
enabled = opcua, mqtt, modbus, tcp

[signals]
# path = signal_id, periodo_ms, timeout_ms (tiempo máximo entre recepciones, D3)
# Ejemplo: planta/estacion_a/nivel = 1, 1000, 3000
